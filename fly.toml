app = "homemend"
primary_region = "fra"
[build]
[env]
  PORT = "3001"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  HOMEMEND_DATA_DIR = "/data"
  ALLOWED_ORIGINS = "https://mogohary99.github.io"
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
[[mounts]]
  source = "homemend_data"
  destination = "/data"
[checks]
  [checks.health]
    type = "http"
    port = 3001
    path = "/health"
    interval = "30s"
    timeout = "5s"
